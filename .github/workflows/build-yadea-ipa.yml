name: Build Yadea unsigned IPA

# 无 Mac 编译 iOS 应用：在 GitHub 的 macOS 运行器上用 xcodebuild 产出未签名 IPA，
# 下载后用侧载工具（全能签 / SideStore / AltStore）自行签名安装。
#
# 注意：源码不含 MFI 配件认证身份（certificate.p7b / leaf.cer / private.x963），
# 编译出的 IPA 需要先在本地运行 `python Tools/inject_identity.py` 注入身份，
# 才能让本机 CarPlay 正常连接。

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build unsigned archive
        run: |
          set -o pipefail
          if xcodebuild archive \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/TDSCarKit.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" > /tmp/build.log 2>&1; then
            tail -20 /tmp/build.log
          else
            echo "编译失败，错误摘要："
            { echo "BUILD_FAIL $(date -u)"; echo ""; echo "== error 行 ==";
              grep -nE "error:|BUILD FAILED|The following build commands failed" /tmp/build.log | head -60 || true;
              echo ""; echo "== 末尾 120 行 =="; tail -120 /tmp/build.log; } > ci-build-status.txt
            cat ci-build-status.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-build-status.txt
            git commit -m "ci: 构建失败日志" || true
            git push || true
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          APP_DIR="build/TDSCarKit.xcarchive/Products/Applications"
          APP="$(find "$APP_DIR" -maxdepth 1 -name '*.app' | head -1)"
          echo "打包 App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CarWithin-yadea-unsigned.ipa Payload
          echo "产物:"
          ls -la CarWithin-yadea-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-yadea-unsigned
          path: CarWithin-yadea-unsigned.ipa
          retention-days: 30
